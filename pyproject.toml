[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "soundpick"
version = "0.1.0"
description = "音拾：面向家庭的短视频原始音轨提取工具"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "itsdangerous>=2.2,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "coverage>=7.16,<8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["app"]
concurrency = ["thread"]
data_file = "work/coverage/.coverage"

[tool.coverage.report]
show_missing = true
precision = 1
fail_under = 85
