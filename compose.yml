services:
  app:
    build: .
    image: soundpick:0.1.0
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - soundpick-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - soundpick

volumes:
  soundpick-data:

networks:
  soundpick:
